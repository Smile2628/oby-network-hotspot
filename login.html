<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OBY NETWORK - Hotspot Login</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;align-items:center;
 justify-content:center;padding:20px;
 font-family:Arial,sans-serif;color:#fff;
 background:linear-gradient(135deg,#07152e,#123d78);
}
.card{
 width:100%;max-width:370px;padding:35px 28px;
 border:1px solid #31527d;border-radius:18px;
 background:#102747;box-shadow:0 18px 45px #0006;
}
.logo{
 width:62px;height:62px;margin:0 auto 16px;
 display:grid;place-items:center;border-radius:16px;
 background:#1677e8;font-size:25px;font-weight:bold;
}
h1{text-align:center;font-size:25px;margin:0}
.sub{text-align:center;color:#a9bfdc;font-size:13px;margin:9px 0 28px}
label{display:block;font-size:13px;margin:15px 0 7px;color:#d9e7fa}
input{
 width:100%;padding:13px;border-radius:9px;
 border:1px solid #38577d;background:#091b34;color:white;
 outline:none;font-size:14px;
}
input:focus{border-color:#3b9cff}
button{
 width:100%;margin-top:23px;padding:14px;border:0;
 border-radius:9px;background:#1684f8;color:white;
 font-size:15px;font-weight:bold;cursor:pointer;
}
button:hover{background:#086bd2}
.error{color:#ffb2b2;text-align:center;font-size:13px;margin-top:14px}
.footer{text-align:center;color:#8fa8c8;font-size:11px;margin-top:25px}
</style>
<script src="md5.js"></script>
<script>
function doLogin(){
 document.sendin.username.value=document.login.username.value;
 document.sendin.password.value=hexMD5('$(chap-id)'+document.login.password.value+'$(chap-challenge)');
 document.sendin.submit();
 return false;
}
</script>
</head>
<body>
<div class="card">
 <div class="logo">ON</div>
 <h1>OBY NETWORK</h1>
 <div class="sub">Silakan login untuk mengakses internet</div>

 <form name="login" action="$(link-login-only)" method="post"
 $(if chap-id) onSubmit="return doLogin()" $(endif)>
  <input type="hidden" name="dst" value="$(link-orig)">
  <input type="hidden" name="popup" value="true">

  <label>Username</label>
  <input name="username" type="text" value="$(username)"
   placeholder="Masukkan username" required>

  <label>Password</label>
  <input name="password" type="password"
   placeholder="Masukkan password" required>

  <button type="submit">LOGIN SEKARANG</button>
  $(if error)
  <div class="error">$(error)</div>
  $(endif)
 </form>

 <div class="footer">OBY NETWORK &copy; 2026</div>
</div>

<form name="sendin" action="$(link-login-only)" method="post">
 <input type="hidden" name="username">
 <input type="hidden" name="password">
 <input type="hidden" name="dst" value="$(link-orig)">
 <input type="hidden" name="popup" value="true">
</form>
</body>
</html>
